<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikonomi — Ön İzleme</title>
    <meta name="description" content="Bikonomi.com — Akıllı alışverişin zekâsı" />
    <style>
      :root{
        --blue:#007AFF; --green:#00C853; --text:#1f2937; --muted:#6b7280; --bg:#ffffff;
      }
      *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
      .container{max-width:1100px;margin:0 auto;padding:16px}
      .header{position:sticky;top:0;background:#fffcc0;backdrop-filter:saturate(180%) blur(8px);background:#ffffffaa;border-bottom:1px solid #e5e7eb}
      .row{display:flex;gap:12px;align-items:center}
      .grow{flex:1}
      .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
      .badge{background:var(--green);color:#fff;border-radius:10px;padding:2px 8px;font-size:12px}
      .btn{border:none;background:var(--green);color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}
      .btn.outline{background:white;border:1px solid #e5e7eb;color:#111827}
      .input{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px}
      .grid{display:grid;gap:16px}
      .cards{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
      .card{border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;background:white}
      .card .pad{padding:14px}
      .muted{color:var(--muted)}
      .footer{border-top:1px solid #e5e7eb;color:#6b7280;padding:20px;text-align:center;margin-top:30px}
      .tabs{display:flex;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
      .tab{flex:1;text-align:center;padding:10px 0;cursor:pointer;font-weight:600}
      .tab.active{background:#f3f4f6}
      .table{width:100%;border-collapse:collapse;font-size:14px}
      .table td,.table th{padding:10px;border-top:1px solid #e5e7eb;text-align:left}
      .pill{display:inline-block;background:#e8faf0;color:#065f46;padding:2px 8px;border-radius:999px;font-size:12px}
      .h1{font-size:34px;font-weight:800;margin:14px 0}
      .h2{font-size:20px;font-weight:700;margin:12px 0}
      .chip{border:1px solid #e5e7eb;border-radius:999px;padding:6px 10px;font-size:12px;color:#374151}
      .row-center{display:flex;justify-content:center;gap:8px;align-items:center}
      .gradient{background:linear-gradient(135deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
      .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center}
      .modal{background:#fff;border-radius:16px;max-width:520px;width:95%;padding:16px;border:1px solid #e5e7eb}
      .show{display:flex}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
